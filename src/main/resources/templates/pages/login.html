<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — EMP- Modern Employee Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            padding: 2.5rem 2.25rem;
        }
        [data-bs-theme="dark"] .login-card {
            background: #111827;
            border: 1px solid #1f2937;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
            <i class="bi bi-briefcase-fill"></i>
        </div>
        <h2 class="h4 fw-bold mb-1">EMP- Modern Employee Tracker</h2>
        <p class="text-muted small">Modern Corporate Workforce Management</p>
    </div>

    <div th:if="${loginError}" class="alert alert-danger py-2 px-3 small border-0 mb-3" role="alert">
        <i class="bi bi-exclamation-circle-fill me-1"></i>
        <span th:text="${loginError}">Invalid username or password.</span>
    </div>

    <div th:if="${logoutMessage}" class="alert alert-success py-2 px-3 small border-0 mb-3" role="alert">
        <i class="bi bi-check-circle-fill me-1"></i>
        <span th:text="${logoutMessage}">You have been signed out.</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label small fw-semibold">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Username" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label small fw-semibold mb-0">Password</label>
            </div>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
        </button>
    </form>

    <p class="tw-mt-4 tw-mb-0 tw-text-center tw-text-xs tw-italic tw-text-slate-500 dark:tw-text-slate-400" data-quote>Great teams are built on clear goals, honest feedback and mutual trust.</p>

    <div class="mt-4 pt-3 border-top text-center text-muted" style="font-size: 0.75rem;">
        <div>Protected by Spring Security with BCrypt & CSRF</div>
        <div class="mt-1">Built by <strong>Mohit Shinde</strong></div>
    </div>
</div>

<script th:src="@{/js/quotes.js}"></script>
</body>
</html>
