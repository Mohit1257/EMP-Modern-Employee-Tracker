<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head(${isEdit ? 'Edit Department' : 'Add Department'})}"></head>
<body>

<aside th:replace="~{fragments/layout :: sidebar(${activeNav})}"></aside>

<div class="app-main">
    <header th:replace="~{fragments/layout :: topbar(${isEdit ? 'Edit Department' : 'New Department'})}"></header>

    <main class="app-content">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="mb-4">
            <a th:href="@{/departments}" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1">
                <i class="bi bi-arrow-left"></i> Cancel and Return to Departments
            </a>
        </div>

        <div class="card border-0 shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-header bg-transparent border-bottom py-3">
                <h5 class="fw-bold mb-1" th:text="${isEdit ? 'Update Department Details' : 'Create Department'}">Department Information</h5>
                <p class="text-muted small mb-0">Specify the unique department identifier code, corporate title, and office location.</p>
            </div>

            <div class="card-body p-4">
                <form th:action="${isEdit} ? @{/departments/edit/{id}(id=${departmentId})} : @{/departments/add}"
                      th:object="${departmentForm}" method="post">

                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2 small mb-3">
                        <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Global error</div>
                    </div>

                    <div class="mb-3">
                        <label for="departmentCode" class="form-label small fw-semibold">Department Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="departmentCode" th:field="*{departmentCode}"
                               placeholder="e.g. ENG, HR, MKT" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{departmentCode}">Code required</div>
                        <small class="text-muted">Short 2-10 character alphanumeric code.</small>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label small fw-semibold">Department Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}"
                               placeholder="e.g. Engineering & Architecture" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{name}">Name required</div>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label small fw-semibold">Location / Floor</label>
                        <input type="text" class="form-control" id="location" th:field="*{location}"
                               placeholder="e.g. Tech Center, Floor 4" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{location}">Invalid location</div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label small fw-semibold">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                  placeholder="Describe the operational scope of this department..." th:errorclass="is-invalid"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}">Invalid description</div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/departments}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i> <span th:text="${isEdit ? 'Save Changes' : 'Create Department'}">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
