<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Error')}"></head>
<body>

<div class="d-flex align-items-center justify-content-center min-vh-100 p-4">
    <div class="card border-0 shadow text-center p-5" style="max-width: 500px;">
        <div class="mb-3 text-warning">
            <i class="bi bi-exclamation-triangle-fill" style="font-size: 3.5rem;"></i>
        </div>
        <h2 class="h4 fw-bold mb-2" th:text="${error != null ? error : 'Application Notice'}">Unexpected Error</h2>
        <p class="text-muted mb-4" th:text="${message != null ? message : 'The requested resource could not be found or an unexpected error occurred.'}">
            An unexpected error occurred.
        </p>
        <div>
            <a th:href="@{/}" class="btn btn-primary px-4 fw-semibold">
                <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>

</body>
</html>
