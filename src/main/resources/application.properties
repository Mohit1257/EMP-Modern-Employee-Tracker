spring.application.name=EMP- Modern Employee Tracker
server.port=8080

# DATABASE CONFIGURATION (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emp_track_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# THYMELEAF CONFIGURATION
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# STATIC RESOURCES
spring.web.resources.static-locations=classpath:/static/

# INITIAL ADMIN CONFIGURATION
emptrack.admin.username=${EMPTRACK_ADMIN_USERNAME:}
emptrack.admin.password=${EMPTRACK_ADMIN_PASSWORD:}
emptrack.admin.email=${EMPTRACK_ADMIN_EMAIL:}
emptrack.admin.full-name=${EMPTRACK_ADMIN_NAME:System Administrator}

# DEMO DATA CONFIGURATION
emptrack.seed-demo-data=${EMPTRACK_SEED_DEMO_DATA:true}

# DATABASE INITIALIZATION
spring.sql.init.mode=never

# SESSION COOKIE SECURITY
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


# Set EMPTRACK_DEMO_ACCOUNTS_ENABLED=false to turn them off.
emptrack.demo-accounts.enabled=${EMPTRACK_DEMO_ACCOUNTS_ENABLED:true}
